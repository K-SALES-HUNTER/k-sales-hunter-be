spring:
  application:
    name: k-sales-hunter-be

  datasource:
    # AI 레포의 docker-compose 가 띄우는 PostgreSQL 을 공유한다.
    # 스키마 분리: public = Spring 소유, ai = AI 서비스 소유.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sales_hunter}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    # 스키마는 Flyway 가 소유한다. Hibernate 가 테이블을 만들지 않게 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration
    # public 스키마에 AI 레포 init_db.sql 이 만든 _isolation_probe 가 이미 있어서
    # baseline 없이는 "Found non-empty schema" 로 실패한다.
    baseline-on-migrate: true
    # baseline-version 기본값이 1 이라 그대로 두면 V1 을 "이미 적용됨"으로 보고 건너뛴다.
    # 0 으로 내려야 V1 부터 실제로 돈다.
    baseline-version: 0

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      # 상세페이지 이미지 직접 업로드. 상품 사진 원본 기준
      max-file-size: 10MB
      max-request-size: 12MB

  http:
    client:
      # AI 호출 타임아웃. LLM 잡은 시작만 시키고 폴링으로 확인하므로 요청 자체는 짧게 끊는다.
      connect-timeout: 3s
      read-timeout: 30s

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

# AI 서비스(FastAPI + LangGraph). Spring 은 /internal/ai/* 로만 호출한다.
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}

# 업로드·AI 생성 이미지 저장 위치. AI 서비스의 DEV_BFF_UPLOAD_DIR 과 같은 디렉터리를 가리켜야 한다.
# (AI 가 참고 사진을 여기서 읽고, 생성 이미지를 여기에 쓴다. URL 은 둘 다 /api/v1/uploads/{name})
storage:
  upload-dir: ${UPLOAD_DIR:../k-sales-hunter-ai/uploads}

# FE 개발 서버. CORS 허용 출처.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
